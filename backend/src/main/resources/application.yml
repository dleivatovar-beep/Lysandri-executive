spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lysandri_db}}
    username: ${SPRING_DATASOURCE_USERNAME:lysandri_app}
    password: ${SPRING_DATASOURCE_PASSWORD:lysandri_app_secret_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    validate-on-migrate: false
    locations: classpath:db/migration
    user: ${SPRING_FLYWAY_USER:lysandri_admin}
    password: ${SPRING_FLYWAY_PASSWORD:lysandri_admin_secret_2026}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:no-reply@lysandri.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A}
  expiration: ${JWT_EXPIRATION_MS:86400000}

