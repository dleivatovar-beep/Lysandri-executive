spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:}}
    user: ${SPRING_FLYWAY_USER:}
    password: ${SPRING_FLYWAY_PASSWORD:}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:no-reply@lysandri.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

moodle:
  url: ${MOODLE_URL:http://localhost:8081}
  token: ${MOODLE_TOKEN:dev_moodle_wstoken_lysandri}

izipay:
  shop-id: ${IZIPAY_SHOP_ID:test_shop_lysandri}
  api-key: ${IZIPAY_API_KEY:test_password_lysandri_key}
  public-key: ${IZIPAY_PUBLIC_KEY:test_public_key_lysandri}
  sha256-key: ${IZIPAY_SHA256_KEY:test_hmac_sha256_key}
  endpoint: ${IZIPAY_ENDPOINT:https://api.micuentaweb.pe}
  success-url: ${IZIPAY_SUCCESS_URL:http://localhost:3000/checkout/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${IZIPAY_CANCEL_URL:http://localhost:3000/checkout/cancel}

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_mock_lysandri_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_lysandri_secret}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/checkout/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/checkout/cancel}

llm:
  provider: ${LLM_PROVIDER:openai}
  api-key: ${OPENAI_API_KEY:mock-key}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

accounting:
  audit-pin: ${ACCOUNTING_AUDIT_PIN:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://127.0.0.1:3000,http://127.0.0.1:5173}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  security:
    activation-encryption-key: ${ACTIVATION_ENCRYPTION_KEY:}
    activation-encryption-key-previous: ${ACTIVATION_ENCRYPTION_KEY_PREVIOUS:}
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  outbox:
    activation:
      enabled: ${APP_OUTBOX_ACTIVATION_ENABLED:true}
      fixed-delay-ms: ${APP_OUTBOX_ACTIVATION_FIXED_DELAY_MS:5000}
  bancos:
    bcp:
      banco: ${BANCO_BCP_NOMBRE:BCP}
      titular: ${BANCO_BCP_TITULAR:LYSANDRI S.A.C.}
      moneda: ${BANCO_BCP_MONEDA:USD}
      tipo-cuenta: ${BANCO_BCP_TIPO:CORRIENTE}
      numero-cuenta: ${BANCO_BCP_NUMERO:}
      cci: ${BANCO_BCP_CCI:}
      activo: ${BANCO_BCP_ACTIVO:false}
    interbank:
      banco: ${BANCO_INTERBANK_NOMBRE:INTERBANK}
      titular: ${BANCO_INTERBANK_TITULAR:LYSANDRI S.A.C.}
      moneda: ${BANCO_INTERBANK_MONEDA:USD}
      tipo-cuenta: ${BANCO_INTERBANK_TIPO:CORRIENTE}
      numero-cuenta: ${BANCO_INTERBANK_NUMERO:}
      cci: ${BANCO_INTERBANK_CCI:}
      activo: ${BANCO_INTERBANK_ACTIVO:false}
    yape:
      nombre: ${YAPE_NOMBRE:YAPE}
      titular: ${YAPE_TITULAR:LYSANDRI S.A.C.}
      moneda: ${YAPE_MONEDA:PEN}
      telefono: ${YAPE_TELEFONO:}
      activo: ${YAPE_ACTIVO:false}
    plin:
      nombre: ${PLIN_NOMBRE:PLIN}
      titular: ${PLIN_TITULAR:LYSANDRI S.A.C.}
      moneda: ${PLIN_MONEDA:PEN}
      telefono: ${PLIN_TELEFONO:}
      activo: ${PLIN_ACTIVO:false}
whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}
  api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v21.0}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  connect-timeout-ms: ${WHATSAPP_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${WHATSAPP_READ_TIMEOUT_MS:10000}
